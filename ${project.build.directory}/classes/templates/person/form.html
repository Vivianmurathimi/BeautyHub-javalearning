<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <h2 class="mb-4"
        th:text="${person != null and
        person.id != null}
        ? 'Edit Person' : 'Add New Person'">
    </h2>

    <div th:replace="~{fragments/alerts
            :: requiredNote}">
    </div>

    <div class="card">
        <div class="card-body">

            <form th:action="@{/persons/save}"
                  th:object="${person}"
                  method="post">

                <!-- VALIDATION ERRORS -->
                <div th:replace="~{fragments/alerts ::
                        validationErrors(${errors})}">
                </div>

                <input type="hidden"
                       th:if="${person != null
                       and person.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Name
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           th:class="${#fields.hasErrors('name')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. John Doe"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Personal ID
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{personalId}"
                           th:class="${#fields.hasErrors('personalId')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. 123456789"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('personalId')}"
                         th:errors="*{personalId}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Address
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{address}"
                           th:class="${#fields.hasErrors('address')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. 123 Main St"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Country
                        <span style="color:#dc2626">*</span>
                    </label>
                    <select name="countryId"
                            class="form-control">
                        <option value="">
                            -- Select Country --
                        </option>
                        <option
                                th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}"
                                th:selected="${person != null
                            and person.country != null
                            and person.country.id
                            == country.id}">
                        </option>
                    </select>
                </div>

                <div th:replace="~{fragments/alerts ::
                        formButtons(
                        'Save Person',
                        '/persons')}">
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
