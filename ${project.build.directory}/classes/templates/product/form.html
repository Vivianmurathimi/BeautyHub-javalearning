<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <h2 class="mb-4"
        th:text="${product != null and
        product.id != null}
        ? 'Edit Product' : 'Add New Product'">
    </h2>

    <div th:replace="~{fragments/alerts
            :: requiredNote}">
    </div>

    <div class="card">
        <div class="card-body">

            <form th:action="@{/products/save}"
                  th:object="${product}"
                  method="post">

                <!-- VALIDATION ERRORS -->
                <div th:replace="~{fragments/alerts ::
                        validationErrors(${errors})}">
                </div>

                <input type="hidden"
                       th:if="${product != null
                       and product.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Product Name
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           th:class="${#fields.hasErrors('name')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. Hair Relaxer"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>
                    <textarea
                            th:field="*{description}"
                            class="form-control"
                            rows="3"
                            placeholder="e.g. Professional hair relaxer">
                    </textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Price
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           th:class="${#fields.hasErrors('price')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. 29.99"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('price')}"
                         th:errors="*{price}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Supplier (Company)
                        <span style="color:#dc2626">*</span>
                    </label>
                    <select name="companyId"
                            class="form-control">
                        <option value="">
                            -- Select Company --
                        </option>
                        <option
                                th:each="company : ${companies}"
                                th:value="${company.id}"
                                th:text="${company.name}"
                                th:selected="${product != null
                            and product.company != null
                            and product.company.id
                            == company.id}">
                        </option>
                    </select>
                </div>

                <div th:replace="~{fragments/alerts ::
                        formButtons(
                        'Save Product',
                        '/products')}">
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
