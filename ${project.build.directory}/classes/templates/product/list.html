<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <div th:replace="~{fragments/alerts ::
            pageHeader('Products',
            '/products/new',
            '+ Add New Product')}">
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Supplier</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.description}">
                    </td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.company != null ?
                            product.company.name :
                            'N/A'}">
                    </td>
                    <td>
                        <a th:href="@{/products/edit/{id}
                                (id=${product.id})}"
                           class="btn btn-sm
                           btn-primary-custom">
                            Edit
                        </a>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/products/delete/{id}
                                      (id=${product.id})}"
                              method="post"
                              class="d-inline">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm(
                                    'Are you sure?')">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
