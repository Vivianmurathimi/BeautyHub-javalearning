<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0"/>
    <title>Beauty Hub — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <style>
        body {
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px
            rgba(14,165,233,0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-title {
            color: #0ea5e9;
            font-weight: bold;
            font-size: 2rem;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 8px;
        }
        .login-subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-label {
            color: #0284c7;
            font-weight: 600;
        }
        .form-control {
            border: 1px solid #7dd3fc;
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 0.2rem
            rgba(14,165,233,0.25);
        }
        .btn-login {
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 8px;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #0284c7;
            color: white;
            transform: translateY(-2px);
        }
        .alert-error {
            background-color: #fee2e2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .alert-logout {
            background-color: #dcfce7;
            border: 1px solid #86efac;
            color: #16a34a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="login-title">💄 BEAUTY HUB</div>
    <div class="login-subtitle">
        Where Style Meets Technology
    </div>

    <!-- ERROR MESSAGE — wrong password -->
    <div th:if="${param.error}"
         class="alert-error">
        ❌ Invalid username or password.
        Please try again.
    </div>

    <!-- LOGOUT MESSAGE -->
    <div th:if="${param.logout}"
         class="alert-logout">
        ✅ You have been logged out successfully.
    </div>

    <form th:action="@{/login}"
          method="post">

        <div class="mb-3">
            <label class="form-label">
                Username
            </label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   autofocus/>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Password
            </label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"/>
        </div>

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <button type="submit"
                class="btn-login">
            Login
        </button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
