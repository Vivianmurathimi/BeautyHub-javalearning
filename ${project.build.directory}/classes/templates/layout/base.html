<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,
          initial-scale=1.0"/>
    <title>Beauty Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <style>
        body {
            background-color: #f0f8ff;
            color: #1a1a2e;
        }
        .navbar {
            background-color: #0ea5e9;
            box-shadow: 0 2px 10px
            rgba(14,165,233,0.3);
        }
        .navbar-brand {
            color: #ffffff !important;
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 3px;
        }
        .navbar-brand:hover {
            color: #e0f2fe !important;
        }
        .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #bae6fd !important;
        }
        .btn-primary-custom {
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-primary-custom:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #bae6fd;
            border-radius: 12px;
            box-shadow: 0 4px 15px
            rgba(14,165,233,0.1);
        }
        .table thead th {
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            font-weight: 600;
        }
        .table tbody tr:hover {
            background-color: #f0f9ff;
        }
        .form-control {
            border: 1px solid #7dd3fc;
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 0.2rem
            rgba(14,165,233,0.25);
        }
        .form-label {
            color: #0284c7;
            font-weight: 600;
        }
        h2 {
            color: #0284c7;
            font-weight: bold;
        }
        .footer {
            background-color: #0ea5e9;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }
        .footer span {
            color: #bae6fd;
        }
        .badge-admin {
            background-color: #dc2626;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
        .badge-user {
            background-color: #16a34a;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<!-- NAVIGATION BAR -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            💄 BEAUTY HUB
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">
            <div class="navbar-nav ms-auto">

                <a class="nav-link"
                   th:href="@{/countries}">
                    🌍 Countries
                </a>
                <a class="nav-link"
                   th:href="@{/companies}">
                    🏢 Companies
                </a>
                <a class="nav-link"
                   th:href="@{/shopowners}">
                    🏪 Shop Owners
                </a>
                <a class="nav-link"
                   th:href="@{/persons}">
                    👤 Persons
                </a>
                <a class="nav-link"
                   th:href="@{/products}">
                    🛍️ Products
                </a>

                <!-- SHOW ROLE BADGE -->
                <span sec:authorize="hasRole('ADMIN')"
                      class="badge-admin ms-2 mt-2">
                    ADMIN
                </span>
                <span sec:authorize="hasRole('USER')"
                      class="badge-user ms-2 mt-2">
                    USER
                </span>

                <!-- LOGOUT -->
                <form th:action="@{/logout}"
                      method="post"
                      class="d-inline ms-2">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm
                            btn-outline-light">
                        Logout
                    </button>
                </form>

            </div>
        </div>
    </div>
</nav>

<!-- CONTENT AREA -->
<div class="container mt-4">
    <div layout:fragment="content">
        <!-- Page content goes here -->
    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    <p>© 2026 <span>Beauty Hub</span>
        — Where Style Meets Technology 💄</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
