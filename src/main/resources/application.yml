spring:
  application:
    name: beauty-hub-backend

  # DATABASE
  datasource:
    url: jdbc:h2:mem:beautydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 CONSOLE
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA / HIBERNATE
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  # DATA INITIALIZATION
  sql:
    init:
      mode: always

  # THYMELEAF
  thymeleaf:
    cache: false
    enabled: true
    prefix: classpath:/templates/
    suffix: .html

# SERVER
server:
  port: 8080

# LOGGING
logging:
  level:
    root: INFO
    org:
      springframework:
        security: WARN
        web: WARN
    com:
      beautyhub: DEBUG