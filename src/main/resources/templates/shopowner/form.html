<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">
    <h2 class="mb-4"
        th:text="${shopOwner != null and
        shopOwner.id != null}
        ? 'Edit Shop Owner'
        : 'Add New Shop Owner'">
    </h2>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/shopowners/save}"
                  th:object="${shopOwner}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <input type="hidden"
                       th:if="${shopOwner != null and
                       shopOwner.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Shop Name
                    </label>
                    <input type="text"
                           th:field="*{shopName}"
                           class="form-control"
                           placeholder="e.g. Vivi's Beauty Shop"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Owner Name
                    </label>
                    <input type="text"
                           th:field="*{ownerName}"
                           class="form-control"
                           placeholder="e.g. Vivian Murathimi"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Address
                    </label>
                    <input type="text"
                           th:field="*{address}"
                           class="form-control"
                           placeholder="e.g. 123 Beauty St"/>
                </div>

                <!-- Country Dropdown -->
                <div class="mb-3">
                    <label class="form-label">
                        Country
                    </label>
                    <select name="countryId"
                            class="form-control">
                        <option value="">
                            Select Country
                        </option>
                        <option
                                th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}"
                                th:selected="${shopOwner != null
                            and shopOwner.country != null
                            and shopOwner.country.id
                            == country.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary-custom">
                        Save Shop Owner
                    </button>
                    <a th:href="@{/shopowners}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
