<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <h2 class="mb-4"
        th:text="${shopOwner != null and
        shopOwner.id != null}
        ? 'Edit Shop Owner' : 'Add New Shop Owner'">
    </h2>

    <div th:replace="~{fragments/alerts
            :: requiredNote}">
    </div>

    <div class="card">
        <div class="card-body">

            <form th:action="@{/shopowners/save}"
                  th:object="${shopOwner}"
                  method="post">

                <!-- VALIDATION ERRORS -->
                <div th:replace="~{fragments/alerts ::
                        validationErrors(${errors})}">
                </div>

                <input type="hidden"
                       th:if="${shopOwner != null
                       and shopOwner.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Shop Name
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{shopName}"
                           th:class="${#fields.hasErrors('shopName')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. Vivi's Beauty Shop"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('shopName')}"
                         th:errors="*{shopName}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Owner Name
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{ownerName}"
                           th:class="${#fields.hasErrors('ownerName')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. Vivian Murathimi"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('ownerName')}"
                         th:errors="*{ownerName}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Address
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{address}"
                           th:class="${#fields.hasErrors('address')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. 123 Main St"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Country
                        <span style="color:#dc2626">*</span>
                    </label>
                    <select name="countryId"
                            class="form-control">
                        <option value="">
                            -- Select Country --
                        </option>
                        <option
                                th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}"
                                th:selected="${shopOwner != null
                            and shopOwner.country != null
                            and shopOwner.country.id
                            == country.id}">
                        </option>
                    </select>
                </div>

                <div th:replace="~{fragments/alerts ::
                        formButtons(
                        'Save Shop Owner',
                        '/shopowners')}">
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
