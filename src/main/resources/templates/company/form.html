<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <h2 class="mb-4"
        th:text="${company != null and
        company.id != null}
        ? 'Edit Company' : 'Add New Company'">
    </h2>

    <div th:replace="~{fragments/alerts
            :: requiredNote}">
    </div>

    <div class="card">
        <div class="card-body">

            <form th:action="@{/companies/save}"
                  th:object="${company}"
                  method="post">

                <!-- VALIDATION ERRORS -->
                <div th:replace="~{fragments/alerts ::
                        validationErrors(${errors})}">
                </div>

                <input type="hidden"
                       th:if="${company != null
                       and company.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Company Name
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           th:class="${#fields.hasErrors('name')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. ORS Cosmetics"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Tax ID
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{taxId}"
                           th:class="${#fields.hasErrors('taxId')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. TAX123456"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('taxId')}"
                         th:errors="*{taxId}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Address
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{address}"
                           th:class="${#fields.hasErrors('address')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. 123 Business Ave"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('address')}"
                         th:errors="*{address}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Country (HQ)
                        <span style="color:#dc2626">*</span>
                    </label>
                    <select name="countryId"
                            class="form-control">
                        <option value="">
                            -- Select Country --
                        </option>
                        <option
                                th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}"
                                th:selected="${company != null
                            and company.country != null
                            and company.country.id
                            == country.id}">
                        </option>
                    </select>
                </div>

                <div th:replace="~{fragments/alerts ::
                        formButtons(
                        'Save Company',
                        '/companies')}">
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
