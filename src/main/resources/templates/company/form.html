<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">
    <h2 class="mb-4"
        th:text="${company != null and
        company.id != null}
        ? 'Edit Company'
        : 'Add New Company'">
    </h2>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/companies/save}"
                  th:object="${company}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <input type="hidden"
                       th:if="${company != null and
                       company.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Company Name
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. ORS Cosmetics"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Tax ID
                    </label>
                    <input type="text"
                           th:field="*{taxId}"
                           class="form-control"
                           placeholder="e.g. TAX123456"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Address
                    </label>
                    <input type="text"
                           th:field="*{address}"
                           class="form-control"
                           placeholder="e.g. 123 Business Ave"/>
                </div>

                <!-- Country Dropdown -->
                <div class="mb-3">
                    <label class="form-label">
                        Country (HQ)
                    </label>
                    <select name="countryId"
                            class="form-control">
                        <option value="">
                            Select Country
                        </option>
                        <option
                                th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}"
                                th:selected="${company != null
                            and company.country != null
                            and company.country.id
                            == country.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary-custom">
                        Save Company
                    </button>
                    <a th:href="@{/companies}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
