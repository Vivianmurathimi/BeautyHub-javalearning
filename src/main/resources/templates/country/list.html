<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <div th:replace="~{fragments/alerts ::
            pageHeader('🌍 Countries',
            '/countries/new',
            '+ Add New Country')}">
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Sign</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="country : ${countries}">
                    <td th:text="${country.id}"></td>
                    <td th:text="${country.name}"></td>
                    <td th:text="${country.sign}"></td>
                    <td>
                        <a th:href="@{/countries/edit/{id}
                                (id=${country.id})}"
                           class="btn btn-sm
                           btn-primary-custom">
                            Edit
                        </a>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/countries/delete/{id}
                                      (id=${country.id})}"
                              method="post"
                              class="d-inline">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm(
                                    'Are you sure?')">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
