<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">
    <h2 class="mb-4"
        th:text="${country != null and
        country.id != null}
        ? 'Edit Country'
        : 'Add New Country'">
    </h2>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/countries/save}"
                  th:object="${country}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <input type="hidden"
                       th:if="${country != null and
                       country.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Country Name
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. Hungary"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Country Sign
                    </label>
                    <input type="text"
                           th:field="*{sign}"
                           class="form-control"
                           placeholder="e.g. HU"/>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary-custom">
                        Save Country
                    </button>
                    <a th:href="@{/countries}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
