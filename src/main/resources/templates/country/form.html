
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<body>
<div layout:fragment="content">

    <!-- PAGE HEADER -->
    <h2 class="mb-4"
        th:text="${country != null and country.id != null}
        ? 'Edit Country' : 'Add New Country'">
    </h2>

    <!-- FORM -->
    <div class="card">
        <div class="card-body">
            <form th:action="@{/countries/save}"
                  th:object="${country}"
                  method="post">

                <!-- Hidden ID for editing -->
                <input type="hidden"
                       th:if="${country != null and country.id != null}"
                       th:field="*{id}"/>

                <!-- Name Field -->
                <div class="mb-3">
                    <label class="form-label">
                        Country Name
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. Hungary"/>
                </div>

                <!-- Sign Field -->
                <div class="mb-3">
                    <label class="form-label">
                        Country Sign
                    </label>
                    <input type="text"
                           th:field="*{sign}"
                           class="form-control"
                           placeholder="e.g. HU"/>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary-custom">
                        Save Country
                    </button>
                    <a th:href="@{/countries}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>
</body>
</html>
