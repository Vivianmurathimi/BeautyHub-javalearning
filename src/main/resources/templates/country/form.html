<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <h2 class="mb-4"
        th:text="${country != null and
        country.id != null}
        ? 'Edit Country' : 'Add New Country'">
    </h2>

    <div th:replace="~{fragments/alerts
            :: requiredNote}">
    </div>

    <div class="card">
        <div class="card-body">

            <form th:action="@{/countries/save}"
                  th:object="${country}"
                  method="post">

                <!-- VALIDATION ERRORS -->
                <div th:replace="~{fragments/alerts ::
                        validationErrors(${errors})}">
                </div>

                <input type="hidden"
                       th:if="${country != null
                       and country.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Country Name
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           th:class="${#fields.hasErrors('name')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. Hungary"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('name')}"
                         th:errors="*{name}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Country Sign
                        <span style="color:#dc2626">*</span>
                    </label>
                    <input type="text"
                           th:field="*{sign}"
                           th:class="${#fields.hasErrors('sign')}
                           ? 'form-control is-invalid'
                           : 'form-control'"
                           placeholder="e.g. HU"/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('sign')}"
                         th:errors="*{sign}">
                    </div>
                </div>

                <div th:replace="~{fragments/alerts ::
                        formButtons(
                        'Save Country',
                        '/countries')}">
                </div>

            </form>
        </div>
    </div>
</div>
</body>
</html>
