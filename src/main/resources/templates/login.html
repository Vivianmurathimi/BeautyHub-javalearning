<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,
          initial-scale=1.0"/>
    <title>Beauty Hub - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <style>
        body {
            background: linear-gradient(
                    135deg,
                    #f0f8ff 0%,
                    #e0f2fe 100%
            );
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px
            rgba(14,165,233,0.2);
            width: 100%;
            max-width: 400px;
        }
        .brand-title {
            color: #0ea5e9;
            font-weight: bold;
            font-size: 2rem;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-label {
            color: #0284c7;
            font-weight: 600;
        }
        .form-control {
            border: 1px solid #7dd3fc;
            border-radius: 8px;
            padding: 10px 15px;
        }
        .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 0.2rem
            rgba(14,165,233,0.25);
        }
        .btn-login {
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .error-message {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .success-message {
            background-color: #dcfce7;
            color: #16a34a;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .credentials-hint {
            background-color: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #0284c7;
        }
    </style>
</head>
<body>

<div class="login-card">

    <!-- BRAND -->
    <div class="brand-title">✂ BEAUTY HUB</div>
    <div class="brand-subtitle">
        Where Style Meets Technology
    </div>

    <!-- ERROR MESSAGE -->
    <div class="error-message"
         th:if="${param.error}">
        Invalid username or password. Please try again.
    </div>

    <!-- LOGOUT MESSAGE -->
    <div class="success-message"
         th:if="${param.logout}">
        You have been logged out successfully.
    </div>

    <!-- LOGIN FORM -->
    <form th:action="@{/login}"
          method="post">

        <!-- CSRF TOKEN — required by Spring Security -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <!-- Username -->
        <div class="mb-3">
            <label class="form-label">
                Username
            </label>
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   autofocus/>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">
                Password
            </label>
            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"/>
        </div>

        <!-- Login Button -->
        <button type="submit"
                class="btn-login">
            Login
        </button>

    </form>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
