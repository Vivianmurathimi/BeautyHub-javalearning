<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <div th:replace="~{fragments/alerts ::
            pageHeader('Persons',
            '/persons/new',
            '+ Add New Person')}">
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Personal ID</th>
                    <th>Country</th>
                    <th>Address</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="person : ${persons}">
                    <td th:text="${person.id}"></td>
                    <td th:text="${person.name}"></td>
                    <td th:text="${person.personalId}">
                    </td>
                    <td th:text="${person.country != null ?
                            person.country.name :
                            'N/A'}">
                    </td>
                    <td th:text="${person.address}"></td>
                    <td>
                        <a th:href="@{/persons/edit/{id}
                                (id=${person.id})}"
                           class="btn btn-sm
                           btn-primary-custom">
                            Edit
                        </a>
                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/persons/delete/{id}
                                      (id=${person.id})}"
                              method="post"
                              class="d-inline">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button type="submit"
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm(
                                    'Are you sure you want to delete this person?\n\n' +
                                    'WARNING: You cannot delete a person\n' +
                                    'that has sales linked to it.\n\n' +
                                    'Make sure to remove all related records first!')">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
