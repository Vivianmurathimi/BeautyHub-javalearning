<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">
    <h2 class="mb-4"
        th:text="${person != null and
        person.id != null}
        ? 'Edit Person'
        : 'Add New Person'">
    </h2>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/persons/save}"
                  th:object="${person}"
                  method="post">

                <input type="hidden"
                       th:if="${person != null and
                       person.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Name
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. John Doe"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Personal ID
                    </label>
                    <input type="text"
                           th:field="*{personalId}"
                           class="form-control"
                           placeholder="e.g. 123456789"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Address
                    </label>
                    <input type="text"
                           th:field="*{address}"
                           class="form-control"
                           placeholder="e.g. 123 Main St"/>
                </div>

                <!-- Country Dropdown -->
                <div class="mb-3">
                    <label class="form-label">
                        Country
                    </label>
                    <select name="countryId"
                            class="form-control">
                        <option value="">
                            Select Country
                        </option>
                        <option
                                th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}"
                                th:selected="${person != null
                            and person.country != null
                            and person.country.id
                            == country.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary-custom">
                        Save Person
                    </button>
                    <a th:href="@{/persons}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
