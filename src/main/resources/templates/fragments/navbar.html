<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar"
     class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            💄 BEAUTY HUB
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon">
            </span>
        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">
            <div class="navbar-nav ms-auto">

                <a class="nav-link"
                   th:href="@{/countries}">
                    🌍 Countries
                </a>
                <a class="nav-link"
                   th:href="@{/companies}">
                    🏢 Companies
                </a>
                <a class="nav-link"
                   th:href="@{/shopowners}">
                    🏪 Shop Owners
                </a>
                <a class="nav-link"
                   th:href="@{/persons}">
                    👤 Persons
                </a>
                <a class="nav-link"
                   th:href="@{/products}">
                    🛍️ Products
                </a>

                <span sec:authorize="hasRole('ADMIN')"
                      class="badge-admin ms-2 mt-2">
                    ADMIN
                </span>
                <span sec:authorize="hasRole('USER')"
                      class="badge-user ms-2 mt-2">
                    USER
                </span>

                <form th:action="@{/logout}"
                      method="post"
                      class="d-inline ms-2">
                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>
                    <button type="submit"
                            class="btn btn-sm
                            btn-outline-light">
                        Logout
                    </button>
                </form>

            </div>
        </div>
    </div>
</nav>

</body>
</html>
