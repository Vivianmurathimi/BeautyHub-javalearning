<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">
    <h2 class="mb-4"
        th:text="${product != null and
        product.id != null}
        ? 'Edit Product'
        : 'Add New Product'">
    </h2>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/products/save}"
                  th:object="${product}"
                  method="post">

                <input type="hidden"
                       th:if="${product != null and
                       product.id != null}"
                       th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">
                        Product Name
                    </label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. Hair Relaxer"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Description
                    </label>
                    <textarea
                            th:field="*{description}"
                            class="form-control"
                            rows="3"
                            placeholder="e.g. Professional
                           hair relaxer kit">
                    </textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Price
                    </label>
                    <input type="number"
                           step="0.01"
                           th:field="*{price}"
                           class="form-control"
                           placeholder="e.g. 29.99"/>
                </div>

                <!-- Company Dropdown -->
                <div class="mb-3">
                    <label class="form-label">
                        Supplier (Company)
                    </label>
                    <select name="companyId"
                            class="form-control">
                        <option value="">
                            Select Company
                        </option>
                        <option
                                th:each="company : ${companies}"
                                th:value="${company.id}"
                                th:text="${company.name}"
                                th:selected="${product != null
                            and product.company != null
                            and product.company.id
                            == company.id}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary-custom">
                        Save Product
                    </button>
                    <a th:href="@{/products}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
