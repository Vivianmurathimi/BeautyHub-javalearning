<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<body>
<div layout:fragment="content">

    <h2 class="mb-4"
        th:text="${client != null and client.id != null}
        ? 'Edit Client' : 'Add New Client'">
    </h2>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/clients/save}"
                  th:object="${client}"
                  method="post">

                <!-- Hidden ID for editing -->
                <input type="hidden"
                       th:if="${client != null and client.id != null}"
                       th:field="*{id}"/>

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text"
                           th:field="*{name}"
                           class="form-control"
                           placeholder="e.g. John Doe"/>
                </div>

                <!-- Country Dropdown -->
                <div class="mb-3">
                    <label class="form-label">Country</label>
                    <select name="countryId"
                            class="form-control">
                        <option value="">
                            Select Country
                        </option>
                        <option
                                th:each="country : ${countries}"
                                th:value="${country.id}"
                                th:text="${country.name}"
                                th:selected="${client != null and
                                client.country != null and
                                client.country.id == country.id}">
                        </option>
                    </select>
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text"
                           th:field="*{address}"
                           class="form-control"
                           placeholder="e.g. 123 Main St"/>
                </div>

                <!-- Amount -->
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number"
                           th:field="*{amount}"
                           class="form-control"
                           placeholder="e.g. 1000"/>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit"
                            class="btn btn-primary-custom">
                        Save Client
                    </button>
                    <a th:href="@{/clients}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </div>
    </div>

</div>
</body>
</html>
